#
# Cloudflare Worker — signup/invite/paywall API (worker.js).
#
# The static landing site stays on Cloudflare Pages (the deploy-landing Action,
# main -> supachad.com). This Worker is mounted ONLY on the API paths below;
# Worker routes take precedence over Pages for matching paths, so the site is
# untouched. Everything the Worker returns is generated (JSON or the invite HTML);
# it serves no static assets, so there is no [assets] binding.

name = "supachad-landing-api"
main = "worker.js"
compatibility_date = "2026-05-01"
workers_dev = false

# Mount only the API + invite paths on the production zone. Pages keeps the rest.
routes = [
  { pattern = "supachad.com/api/*",    zone_name = "supachad.com" },
  { pattern = "supachad.com/invite/*", zone_name = "supachad.com" },
]

[vars]
# Flip to "1" ONLY after the CF API token has `Access: Apps and Policies:Edit`.
# Until then, invite redemption / Stripe checkout queue the grant instead of
# calling the CF API (redemption still succeeds; the user is told they're queued).
CF_ACCESS_READY = "0"

# KV for signup requests + single-use invite tokens + premium grants.
# Create once:  wrangler kv namespace create INVITES   (then paste the id below)
[[kv_namespaces]]
binding = "INVITES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set via `wrangler secret put <NAME>`, never in this file):
#   ADMIN_SECRET      — required header X-Admin-Secret to mint invites + read /api/premium/list
#   STRIPE_WEBHOOK_SECRET — whsec_… from the Stripe webhook endpoint (paywall)
#   CF_API_TOKEN      — token WITH Access:Apps and Policies:Edit (mint a dedicated one)
#   CF_ACCOUNT_ID     — Cloudflare account id
#   CF_ACCESS_APP_ID  — the chad.supachad.com Access application id
#   CF_ACCESS_POLICY_ID — the include-emails policy id on that app
